name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - name: Build single-file version
        run: npm run build:single

  schema:
    name: Database schema applies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Add Supabase auth stand-ins
        run: psql -v ON_ERROR_STOP=1 -f .github/ci/supabase-auth-stub.sql
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Apply schema again (must be safe to re-run)
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
