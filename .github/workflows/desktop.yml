name: Desktop app

on:
  pull_request:
    paths: ['desktop/**', 'helper/**', 'src/live/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'helper/**', 'src/live/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            helper/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci
        working-directory: helper
      - run: npm run typecheck
        working-directory: helper
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare-helper
        working-directory: desktop

      - name: Check the bundled helper loads the iRacing SDK
        run: desktop/src-tauri/binaries/nightstint-helper-x86_64-pc-windows-msvc.exe helper/dist/lib/esm/helper.mjs --check-sdk

      # Installed apps update themselves from the latest release, so each build gets a new version.
      # Updates are signed with the TAURI_SIGNING_PRIVATE_KEY secret; without it the build is unsigned.
      - name: Build the installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="0.1.${{ github.run_number }}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then signed=true; else signed=false; fi
          npx tauri build --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":$signed}}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SIGNED=$signed" >> "$GITHUB_ENV"

      - name: Publish the update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          tag="desktop-v$VERSION"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$(basename "$exe")"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify({
              version: process.env.VERSION,
              pub_date: new Date().toISOString(),
              platforms: { 'windows-x86_64': { signature: fs.readFileSync(process.argv[1], 'utf8').trim(), url: process.argv[2] } },
            }, null, 2));
          " "$exe.sig" "$url"
          notes=$(git log -1 --format=%b | head -1); echo "${notes:-$(git log -1 --format=%s)}" > notes.txt
          gh release create "$tag" "$exe" latest.json --target "${{ github.sha }}" --title "Nightstint $VERSION" --notes-file notes.txt --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Nightstint-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
