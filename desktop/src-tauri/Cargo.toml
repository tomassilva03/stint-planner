[package]
name = "nightstint"
version = "0.1.0"
description = "Nightstint for drivers: the planner in its own window, with the iRacing helper built in"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Windows' own TLS, so nothing extra to compile
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
